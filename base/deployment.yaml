apiVersion: apps/v1
kind: Deployment
metadata:
  name: launch-control
spec:
  replicas: 2
  selector:
    matchLabels:
      app: launch-control
  template:
    metadata:
      labels:
        app: launch-control
    spec:
      containers:
        - name: launch-control
          image: registry.example.com/launch-control:1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: base
            - name: LOG_LEVEL
              value: info
