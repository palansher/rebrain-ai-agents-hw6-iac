apiVersion: apps/v1beta2
kind: Deployment
metadata:
  name: {{ include "launch-control.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "launch-control.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "launch-control.fullname" . }}
    spec:
      containers:
        - name: launch-control
          image: "{{ .Values.image.repository }}:latest"
          containerPorts:
            - containerPort: {{ .Values.service.port }}
          livenessProb:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
          securityContext:
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: varlog
              mountPath: /var/log
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
